<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>灵山掌门</title>
<script>
  // 防昼夜闪烁：渲染前先按现实时间挂夜色类（FOUC 修正）
  (function () {
    try {
      var h = new Date().getHours();
      if (h >= 20 || h < 5) document.documentElement.className += ' night';
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<canvas id="bg"></canvas>
<div id="tint-season"></div>
<div id="tint-day"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

    <symbol id="ic-fangshi" viewBox="0 0 48 48"><path d="M12 6 V42"/><path d="M12 10 L34 14 L12 22"/><path d="M20 42 H40"/><path d="M24 42 V30 H36 V42"/><circle cx="30" cy="36" r="1.6" class="seal"/></symbol>

    <symbol id="ic-yaoyuan" viewBox="0 0 48 48"><path d="M24 42 V28"/><path d="M13 28 A11 7 0 1 1 35 28"/><path d="M18 28 C18 34 22 36 24 42"/><circle cx="28" cy="24" r="1.6" class="seal"/></symbol>
    <symbol id="ic-cangjingge" viewBox="0 0 48 48"><path d="M9 15 Q24 4 39 15"/><path d="M12 22 H36 M12 22 V36 H36 V22"/><path d="M12 29 H36"/><circle cx="24" cy="33" r="1.6" class="seal"/></symbol>

    <symbol id="ic-dongfu" viewBox="0 0 48 48"><path d="M5 40 L17 15 L27 33 L33 21 L44 40"/><path d="M20 40 A5 7 0 0 1 30 40"/><circle cx="25" cy="34" r="1.6" class="seal"/></symbol>

      <circle cx="31" cy="15" r="4.6"/>

</svg>
<div id="app">
  <header id="topbar" class="panel">
    <div id="res-bar">
      <div class="res-row" data-res="lingqi"><span class="res-name">灵气</span><span class="res-val">0</span><small class="res-rate"></small></div>
      <div class="res-row" data-res="xiufu"><span class="res-name">修为</span><span class="res-val">0</span><small class="res-rate"></small></div>
      <div class="res-row" data-res="lingshi"><span class="res-name">灵石</span><span class="res-val">0</span><small class="res-rate"></small></div>
      <div class="res-row" data-res="danyao"><span class="res-name">丹药</span><span class="res-val">0</span><small class="res-rate"></small><button id="btn-pill" data-tip="服丹：60 秒内全局产量翻倍">服丹</button><button id="btn-pillhouse" data-tip="丹房：查看库存与丹毒">丹房</button></div>
    </div>
    <div id="buff-bar"></div>
    <div id="top-right">
      <span id="llm-dot" class="dot off" data-tip="LLM 状态"></span>
      <button id="btn-settings" class="icon-btn" data-tip="设置">设置</button>
    </div>
  </header>

  <aside id="left-panel" class="panel">
    <h2 class="panel-title">洞天福地</h2>
    <div id="building-list"></div>
  </aside>

  <main id="center" class="panel">
    <div id="game-date"></div>
    <div id="real-time"></div>
    <div id="realm-name">练气</div>
    <div id="dao-heart"></div>
    <div id="xp-bar"><div id="xp-fill"></div><span id="xp-text">修为 0/150</span><div id="taichi-monk" data-realm="0"><div class="fx fx-zen"></div><div class="fx fx-aura"></div><div class="fx fx-curse"></div><span class="fx fx-star s1"></span><span class="fx fx-star s2"></span><span class="fx fx-star s3"></span><span class="fx fx-star s4"></span><div class="fx fx-halo"></div><svg class="monk-svg" id="monk-ik" viewBox="0 0 48 52">
      <circle cx="24" cy="8" r="4.8"/>
      <g id="monk-eyes"><circle cx="22.4" cy="7.4" r="1.1" fill="var(--ink)" stroke="none"/><circle cx="25.6" cy="7.4" r="1.1" fill="var(--ink)" stroke="none"/></g>
      <path d="M24 13 V26"/>
      <path d="M24 26 L15 41 M24 26 L33 41"/>
      <path d="M11 42 H19 M29 42 H37"/>
      <polyline id="monk-armN" points="0,0 0,0" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>
      <polyline id="monk-armF" points="0,0 0,0" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>
      <circle id="monk-handN" r="1.9" fill="var(--ink)" stroke="none"/>
      <circle id="monk-handF" r="1.9" fill="var(--ink)" stroke="none" opacity=".55"/>
      <circle cx="24" cy="8" r="1.2" class="seal"/>
    </svg></div></div>
    <div id="breath-wrap">
      <button id="btn-breath"><span class="breath-label">吐 纳</span></button>
    </div>
    <button id="btn-break" class="hidden">突 破</button>
    <div id="forewarn" class="hidden">远处隐有异动…</div>
  </main>

  <aside id="right-panel" class="panel">
    <h2 class="panel-title">见闻 <span style="float:right"><button id="btn-help" class="icon-btn" style="font-size:11px;padding:2px 8px;min-height:0">指要</button> <button id="btn-codex" class="icon-btn" style="font-size:11px;padding:2px 8px;min-height:0">图鉴</button></span></h2>
    <div id="log-list"></div>
    <div class="set-row" style="gap:6px"><button id="btn-market" class="icon-btn" style="flex:1">坊 市</button><button id="btn-friends" class="icon-btn" style="flex:1">道友录</button></div>
    <div class="set-row" style="gap:6px"><button id="btn-trial" class="icon-btn" style="flex:1">试 炼 塔</button><button id="btn-codexpage" class="icon-btn" style="flex:1">体 系</button></div>
    <h2 class="panel-title">福泽</h2>
    <div id="perm-list"></div>
    <button id="btn-rebirth" class="btn-primary">转 生</button>
  </aside>
</div>

<div id="modal-root"></div>
<div id="version-mark">灵山掌门 v0.20.0</div>
<div id="toast-root"></div>
<div id="fatal-overlay" class="hidden"></div>

<script src="js/util.js"></script>
<script src="js/state.js"></script>
<script src="js/economy.js"></script>
<script src="js/realm.js"></script>
<script src="js/events.js"></script>
<script src="js/llm.js"></script>
<script src="js/save.js"></script>
<script src="js/ui.js"></script>
<script src="js/ambient.js"></script>
<script src="js/battle.js"></script>
<script src="js/trial.js"></script>
<script src="js/tick.js"></script>
<script src="js/dev.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
