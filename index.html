      <div class="res-row tip-below" data-res="xiufu" data-tip="修为：日积月累的道行。攒满点中央「突破」叩门，成也罢败也罢，回头重攒。"><span class="res-name">修为</span><span class="res-val">0</span><small class="res-rate"></small></div>

      <div class="res-row tip-below" data-res="xinmo" data-tip="心魔：心里养出的戾气。三十滋生、六十缠身、八十五入魔；渡劫冲关更凶，静养自淡。"><span class="res-name">心魔</span><span class="res-val">0</span><small class="res-rate"></small></div>
